<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSE 姿势图库 · 中文版</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --line:#e5e7eb; --text:#1a1d21;
    --muted:#6b7280; --accent:#2f6fed; --accent-soft:#eaf0fe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px 12px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:16px;margin:0 16px 0 0;font-weight:700;letter-spacing:.3px}
  h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  input[type=search]{flex:1 1 220px;min-width:180px;padding:8px 12px;border:1px solid var(--line);
    border-radius:9px;font-size:13px;outline:none;background:var(--panel)}
  input[type=search]:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;color:var(--text)}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tab{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;
    font-size:13px;cursor:pointer;color:var(--muted);transition:.15s}
  .tab:hover{border-color:#c9d3e4}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .meta{margin-top:9px;font-size:12px;color:var(--muted)}
  main{padding:18px 20px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
    cursor:zoom-in;transition:.18s;display:flex;flex-direction:column}
  .card:hover{box-shadow:0 6px 20px rgba(20,30,60,.10);transform:translateY(-2px);border-color:#cfd8e8}
  .thumb{aspect-ratio:3/4;background:var(--panel);position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .no{position:absolute;left:7px;top:7px;background:rgba(15,20,30,.62);color:#fff;
    font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;letter-spacing:.4px}
  .cap{padding:8px 10px 9px;border-top:1px solid var(--line)}
  .cap b{display:block;font-size:12.5px;font-weight:600;line-height:1.35;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cap span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  #more{display:block;margin:26px auto 0;padding:10px 26px;border:1px solid var(--line);
    background:#fff;border-radius:9px;cursor:pointer;font-size:13px}
  #more:hover{border-color:var(--accent);color:var(--accent)}
  dialog{border:none;padding:0;background:transparent;max-width:96vw;max-height:96vh}
  dialog::backdrop{background:rgba(10,14,20,.78);backdrop-filter:blur(4px)}
  .view{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    max-width:min(880px,94vw);max-height:92vh}
  .view img{max-width:100%;max-height:74vh;object-fit:contain;background:#0e1116;display:block;margin:0 auto}
  .info{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
  .info b{font-size:14px}
  .tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:11px}
  .info code{font-size:11px;color:var(--muted);background:var(--panel);padding:2px 6px;border-radius:5px}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;border:none;
    background:rgba(255,255,255,.9);border-radius:10px;font-size:20px;cursor:pointer;color:#333}
  .nav.prev{left:14px} .nav.next{right:14px}
  .empty{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>POSE 姿势图库<small>中文版 · 本地图库</small></h1>
    <input id="q" type="search" placeholder="搜索：姿势名 / 分类 / 编号，例如「蹲姿」「M字」「P001」">
    <select id="fangle"><option value="">全部角度</option></select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="meta" id="stat">加载中…</div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>没有匹配的姿势</div>
  <button id="more" hidden>加载更多</button>
</main>

<dialog id="dlg">
  <div class="view">
    <img id="big" alt="">
    <div class="info">
      <b id="tname"></b>
      <span class="tag" id="tsys"></span>
      <span class="tag" id="tcat"></span>
      <span id="tangle" style="color:var(--muted)"></span>
      <code id="tid"></code>
    </div>
  </div>
</dialog>
<button class="nav prev" id="prev" hidden>‹</button>
<button class="nav next" id="next" hidden>›</button>

<script>
const PAGE = 120;
let all = [], view = [], shown = 0, cur = -1;

const $ = s => document.querySelector(s);
const grid = $('#grid');

fetch('data/pose-zh.json').then(r => r.json()).then(d => {
  all = d;
  const sys = [...new Set(d.map(x => x.体系))];
  const ang = [...new Set(d.map(x => x.角度))];
  const tabs = $('#tabs');
  ['全部', ...sys].forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' on' : '');
    b.textContent = i === 0 ? `全部 ${d.length}` : `${s} ${d.filter(x => x.体系 === s).length}`;
    b.dataset.sys = i === 0 ? '' : s;
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      b.classList.add('on'); apply();
    };
    tabs.appendChild(b);
  });
  ang.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a; $('#fangle').appendChild(o);
  });
  apply();
});

function apply() {
  const q = $('#q').value.trim().toLowerCase();
  const sys = document.querySelector('.tab.on')?.dataset.sys || '';
  const ang = $('#fangle').value;
  view = all.filter(x =>
    (!sys || x.体系 === sys) &&
    (!ang || x.角度 === ang) &&
    (!q || x.检索.toLowerCase().includes(q) || x.姿势名称.includes(q) || x.分类.includes(q))
  );
  $('#stat').textContent = `共 ${view.length} 条 · 显示 ${Math.min(PAGE, view.length)} 条`;
  grid.innerHTML = ''; shown = 0;
  $('#empty').hidden = view.length > 0;
  render();
}

function render() {
  const frag = document.createDocumentFragment();
  view.slice(shown, shown + PAGE).forEach((x, i) => {
    const idx = shown + i;
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="thumb"><span class="no">${x.姿势编号}·${x.角度}</span>
      <img loading="lazy" src="${x.缩略图}" alt="${x.姿势名称}"></div>
      <div class="cap"><b>${x.姿势名称}</b><span>${x.分类}</span></div>`;
    c.onclick = () => open(idx);
    frag.appendChild(c);
  });
  grid.appendChild(frag);
  shown = Math.min(shown + PAGE, view.length);
  $('#stat').textContent = `共 ${view.length} 条 · 显示 ${shown} 条`;
  $('#more').hidden = shown >= view.length;
}

$('#more').onclick = render;
$('#q').oninput = () => { apply(); };
$('#fangle').onchange = apply;

function open(i) {
  cur = i; const x = view[i];
  $('#big').src = x.原图; $('#big').alt = x.姿势名称;
  $('#tname').textContent = x.姿势名称;
  $('#tsys').textContent = x.体系;
  $('#tcat').textContent = x.分类;
  $('#tangle').textContent = '角度：' + x.角度;
  $('#tid').textContent = x.id;
  const d = $('#dlg');
  if (!d.open) d.showModal();
  $('#prev').hidden = $('#next').hidden = false;
}
$('#dlg').onclick = e => { if (e.target.id === 'dlg') close(); };
function close() { $('#dlg').close(); $('#prev').hidden = $('#next').hidden = true; }
$('#prev').onclick = () => cur > 0 && open(cur - 1);
$('#next').onclick = () => cur < view.length - 1 && open(cur + 1);
document.addEventListener('keydown', e => {
  if (!$('#dlg').open) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') $('#prev').click();
  if (e.key === 'ArrowRight') $('#next').click();
});
</script>
</body>
</html>
